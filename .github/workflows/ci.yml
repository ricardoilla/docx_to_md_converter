name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      # Integration tests need a real pandoc: use the pinned one.
      - run: dart run tool/fetch_pandoc.dart --platform macos
      - run: flutter test
        env:
          PANDOC_PATH: ${{ github.workspace }}/third_party/pandoc/macos/pandoc
